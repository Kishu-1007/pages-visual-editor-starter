buildConfiguration:
  buildCommand: SECTION_LIBRARY_REVISION_ID=${YEXT_REVISION_ID:-local} npm run build -- ${YEXT_REVERSE_PROXY_PREFIX:+--reverse-proxy-prefix="$YEXT_REVERSE_PROXY_PREFIX"}
  installDependenciesStep:
    command: npm install
    requiredFiles:
      - package.json
      - package-lock.json
      - .npmrc
